<style>
  body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f4f5f7;color:#111}
  h1{font-size:1.3rem}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
  label{display:block;font-size:.85rem;margin:10px 0 4px;color:#555}
  input[type=text],input[type=time],textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem}
  textarea{min-height:70px}
  .days label{display:inline-flex;align-items:center;gap:3px;margin:4px 8px 0 0;color:#111}
  button,a.btn{display:inline-block;padding:10px 14px;border:0;border-radius:8px;background:#0a84ff;color:#fff;font-size:.95rem;text-decoration:none;margin:8px 6px 0 0;cursor:pointer}
  button.gray{background:#8e8e93} button.red{background:#ff3b30}
  .banner{background:#ffe08a;border-radius:12px;padding:14px;margin-bottom:14px}
  small{color:#666} code{background:#eee;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<h1>SMS Scheduler</h1>
<div id="due"></div>

<div class="card">
  <label>Name</label>
  <input type="text" id="name" placeholder="Expiry alert">
  <label>Phone numbers (comma or new line)</label>
  <textarea id="numbers" placeholder="+35799123456, +35799654321"></textarea>
  <label>Message</label>
  <textarea id="message" placeholder="Milk expires tomorrow"></textarea>
  <label>Days</label>
  <div class="days" id="days"></div>
  <label>Time</label>
  <input type="time" id="time" value="09:00">
  <button onclick="addSchedule()">Add schedule</button>
</div>

<div id="list"></div>

<div class="card">
  <b>Export for Shortcuts</b><br>
  <small>Download <code>schedules.json</code>, commit it to your GitHub repo, and use its raw URL in the Shortcut.</small><br>
  <button onclick="exportJson()">Download schedules.json</button>
  <button class="gray" onclick="copyJson()">Copy JSON</button>
</div>

<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KEY='sms_schedules';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);

$('days').innerHTML=DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" checked>${d}</label>`).join('');

function parseNumbers(s){return s.split(/[,\n;]+/).map(n=>n.replace(/[^\d+]/g,'')).filter(Boolean)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function smsLink(it){return 'sms:'+it.numbers.join(',')+'&body='+encodeURIComponent(it.message)}
function shortcutLink(it){return 'shortcuts://run-shortcut?name=RunSchedule&input=text&text='+encodeURIComponent(it.id)}

function addSchedule(){
  const numbers=parseNumbers($('numbers').value);
  const message=$('message').value.trim();
  const days=[...document.querySelectorAll('#days input:checked')].map(c=>+c.value);
  if(!numbers.length||!message||!days.length||!$('time').value){alert('Add at least one number, a message, a day and a time.');return}
  items.push({id:'s'+Date.now().toString(36),name:$('name').value.trim()||'Schedule',numbers,message,days,time:$('time').value});
  save();render();
  $('name').value='';$('numbers').value='';$('message').value='';
}
function del(id){if(confirm('Delete this schedule?')){items=items.filter(i=>i.id!==id);save();render()}}

function render(){
  $('list').innerHTML=items.map(it=>`
    <div class="card">
      <b>${esc(it.name)}</b> <small>(id: ${it.id})</small><br>
      <small>${it.days.map(d=>DAYS[d]).join(', ')} at ${it.time}</small><br>
      <small>To: ${esc(it.numbers.join(', '))}</small>
      <p>${esc(it.message)}</p>
      <a class="btn" href="${smsLink(it)}">Send now</a>
      <a class="btn gray" href="${shortcutLink(it)}">Run via Shortcut</a>
      <button class="red" onclick="del('${it.id}')">Delete</button>
    </div>`).join('')||'<p><small>No schedules yet.</small></p>';
}

function data(){return JSON.stringify(items,null,2)}
function exportJson(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data()],{type:'application/json'}));
  a.download='schedules.json';a.click();
}
async function copyJson(){try{await navigator.clipboard.writeText(data());alert('Copied')}catch(e){prompt('Copy:',data())}}

// Reminder banner: only works while this page is open
let fired={};
function check(){
  const n=new Date();
  const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const day=n.getDay(), stamp=n.toDateString()+hm;
  items.forEach(it=>{
    if(it.time===hm&&it.days.includes(day)&&!fired[it.id+stamp]){
      fired[it.id+stamp]=1;
      const d=document.createElement('div');d.className='banner';
      d.innerHTML=`<b>Due: ${esc(it.name)}</b><br><a class="btn" href="${smsLink(it)}">Send now</a>`;
      $('due').appendChild(d);
      if(navigator.vibrate)navigator.vibrate(200);
    }
  });
}
setInterval(check,15000);
render();
</script>
</body>
</html>
